<!DOCTYPE html>
<html>
<head>
    <title>Login - DonDon Donuts</title>
    <link rel="icon" type="image/x-icon" href="donut pics/Donicon.png">
    <link rel="stylesheet" href="dondonstyle.css">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>

    <img  src="donut pics/loginbr.gif" id="bg-video">

    <div class="welcome-text">
        <h1>Welcome to DONDON Donuts!</h1>
    </div>

    <div class="login-box">
        <h2>Login</h2>

        <form action="Home.html">
            <input type="text" id="Username" placeholder="Username" required>
            <input type="password" placeholder="Password" required>

            <button type="submit">Login</button>

            <p class="forgot">
                <a href="#">Forgot Password?</a>
            </p>

            <div class="divider">OR</div>

            <button type="button" class="google-btn">Continue with Google</button>
            <button type="button" class="facebook-btn">Continue with Facebook</button>
        </form>
    </div>

</body>
</html>
